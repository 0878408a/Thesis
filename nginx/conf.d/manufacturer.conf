# ============================================================================
# Manufacturer 對外入口: 8443 mTLS
#   從既有 thesis/manufacturer_agent/nginx/nginx.conf 遷移而來。
#   維持 mTLS 邊界: ssl_verify_client on, client CA 驗證。
#   上游一律 plain HTTP; mTLS 在本 server 終結。
#
#   /manufacturer/agent/...   → manufacturer-agent (Django, :8000)
#   /manufacturer/client/...  → manufacturer-client (Flask, :5002/internal/)
# ============================================================================

server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/certs/server_cert.pem;
    ssl_certificate_key /etc/nginx/certs/server_key.pem;
    ssl_client_certificate /etc/nginx/certs/client_ca.pem;
    ssl_verify_client on;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # /manufacturer/agent/ → manufacturer-agent (Django, :8000, 內部 plain HTTP)
    #   Host 固定為 upstream 容器名 (manufacturer-agent),
    #   對應 DJANGO_ALLOWED_HOSTS; 外部 Host 經 X-Forwarded-Host 保留。
    location /manufacturer/agent/ {
        proxy_pass http://manufacturer-agent:8000/;
        proxy_set_header Host manufacturer-agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # /manufacturer/client/ → manufacturer-client (Flask internal, :5002, HTTP)
    location /manufacturer/client/ {
        proxy_pass http://manufacturer-client:5002/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /internal/manufacturer/... → manufacturer-client (Flask, :5002/internal/)
    # 前端以絕對路徑 fetch('/internal/manufacturer/history/')，
    # 因此 nginx 需將 /internal/ 轉發到 manufacturer-client 的 /internal/
    location /internal/ {
        proxy_pass http://manufacturer-client:5002/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /manufacturer/ → manufacturer 前端靜態檔 (vite build 產出 dist/)
    location /manufacturer/ {
        alias /usr/share/nginx/manufacturer-html/;
        index index.html;
        try_files $uri $uri/ /manufacturer/index.html;
    }
}
