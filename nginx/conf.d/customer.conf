# ============================================================================
# Customer 對外入口: 80 redirect + 443 HTTPS
#   /            → customer-frontend static (dist/)
#   /api/        → customer-agent public (5001, TLS upstream)
#   80           → 301 重導向至 443
# ============================================================================

# 80 僅做 301 重導向, 避免 plaintext
server {
    listen 80;
    server_name _;
    return 301 https://$host:443$request_uri;
}

# Customer 對外入口: 443 HTTPS (server-only TLS)
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/certs/customer_server_cert.pem;
    ssl_certificate_key /etc/nginx/certs/customer_server_key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # customer 前端靜態檔 (vite build 產出 dist/)
    root  /usr/share/nginx/html;
    index index.html;

    # /api/ → customer-agent public server (HTTPS, server-only TLS)
    location /api/ {
        # 保留 /api 前綴; customer-agent 實際路由為 /api/customer/... , 不可 strip
        proxy_pass https://customer-agent:5001;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;      # 本地自簽; 正式環境應 verify on + CA
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
