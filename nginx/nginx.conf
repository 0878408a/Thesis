# ============================================================================
# Thesis 統合 Nginx 對外入口 (single entry point)
#
# 對外只暴露兩個 port:
#   - :443   Customer 端  (Browser)
#            /            → customer-frontend static (dist/)
#            /api/        → customer-agent public (5001, TLS)
#   - :8443  Manufacturer 端 (mTLS)
#            /manufacturer/client/...  → manufacturer-client (5002, HTTP)
#            /manufacturer/agent/...   → manufacturer-agent Django (8000, HTTP)
#                 上游一律 plain HTTP; mTLS 在本 nginx 8443 終結。
#
# 本檔為「Docker 容器內 nginx」使用的整合設定, 容器內上游一律以 service name
# (customer-agent / manufacturer-agent / manufacturer-client) 指稱, 不硬編 localhost。
#
# 路徑拆分:
#   conf.d/customer.conf     — 80 redirect + 443 customer HTTPS
#   conf.d/manufacturer.conf — 8443 manufacturer mTLS
#
# 憑證: 學術用 git-tracked .pem 透過 volume 掛入 /etc/nginx/certs/。
# Docker Compose 將 ./nginx/conf.d/ 掛至 /etc/nginx/conf.d/ (見 docker-compose.yml)。
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # 各端 server block 拆至 conf.d/
    include /etc/nginx/conf.d/*.conf;
}
