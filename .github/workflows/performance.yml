# ============================================================================
# Thesis Performance Test (k6 v2.2.0, GitHub Actions)
# 第一版只測 Customer Agent 兩個唯讀 API:
#   GET /api/customer/<customer_id>/firmware
#   GET /api/customer/<customer_id>/devices
# 不測: Manufacturer Upload / IOTA transaction / submit_firmware.ts
#
# 規模 (第一版 CI):
#   Smoke: 10 VU / 30s
#   Load:  50 VU / 60s
# 100/200 VU 與 overnight soak 留給手動測試。
#
# k6 在 GitHub Runner host 上直接執行 (customer-agent :5001 已 host-expose)
# ============================================================================

name: Performance

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  K6_VERSION: "v2.2.0"

jobs:
  k6-performance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker build -f Dockerfile.customer-agent    -t thesis/customer-agent .
          docker build -f Dockerfile.manufacturer-client -t thesis/manufacturer-client .
          docker build -f Dockerfile.manufacturer-agent  -t thesis/manufacturer-agent .

      # CI 專用 .env: 動態產生 (不把本機 .env commit 到 repo)
      # 只使用 CI-only 測試值; 非 production secret
      - name: Create CI .env files
        env:
          CI_DB_PASSWORD: ci-test-db-password
        run: |
          # customer agent .env (DB only; 無 IOTA / Telegram)
          cat > thesis/customer_agent/.env <<'EOF'
          DB_ENGINE=django.db.backends.mysql
          DB_NAME=customer_database
          DB_USER=root
          DB_PASSWORD=${CI_DB_PASSWORD}
          DB_HOST=mariadb
          DB_PORT=3306
          EOF

          # manufacturer agent .env (DB + IOTA_NETWORK; 無 IOTA_PRIVATE_KEY_BASE64)
          # IOTA key 由 compose inline env 注入; 若 CI 需要真實 key, 改走 GitHub Secrets
          cat > thesis/manufacturer_agent/.env <<'EOF'
          IOTA_NETWORK=testnet
          DB_ENGINE=django.db.backends.mysql
          DB_NAME=mydatabase
          DB_USER=root
          DB_PASSWORD=${CI_DB_PASSWORD}
          DB_HOST=mariadb
          DB_PORT=3306
          DJANGO_SECRET_KEY=ci-test-insecure-django-secret-key
          DJANGO_DEBUG=True
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

          # 根目錄 .env 供 docker compose 讀取 (DB_PASSWORD / MYSQL_ROOT_PASSWORD / DJANGO_SECRET_KEY)
          cat > .env <<'EOF'
          DB_PASSWORD=ci-test-db-password
          MYSQL_ROOT_PASSWORD=ci-test-db-password
          DJANGO_SECRET_KEY=ci-test-insecure-django-secret-key
          IOTA_PRIVATE_KEY_BASE64=
          EOF

          # 設定 CI_DB_PASSWORD 供後續 mariadb exec 步驟使用 (GITHUB_ENV; 不用 export)
          echo "CI_DB_PASSWORD=ci-test-db-password" >> "$GITHUB_ENV"

      # frontend dist/ (nginx mount 需要)
      - name: Build frontend dist
        run: |
          cd thesis/customer_agent/frontend/customer
          npm ci --quiet && npm run build
          cd ../../../thesis/manufacturer_client/frontend/manufacturer
          npm ci --quiet && npm run build
          cd ../../../..

      - name: Start compose stack
        run: docker compose up -d

      - name: Wait for customer-agent
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:5001/ > /dev/null 2>&1; then
              echo "customer-agent ready"; break
            fi
            echo "waiting... ($i/40)"; sleep 5
          done

      - name: Wait for mariadb
        run: |
          for i in $(seq 1 30); do
            if docker exec thesis-mariadb mysqladmin ping -uroot -p"$CI_DB_PASSWORD" 2>/dev/null; then
              echo "mariadb ready"; break
            fi
            echo "waiting... ($i/30)"; sleep 5
          done

      # 從 CI DB 取 customer_id (不硬編碼本機 uuid)
      - name: Extract CUSTOMER_ID from CI database
        id: extract-cid
        run: |
          CID=$(docker exec thesis-mariadb mysql -uroot -p"$CI_DB_PASSWORD" \
            -N -e "SELECT customer_id FROM customer_database.customer LIMIT 1" 2>/dev/null)
          if [ -z "$CID" ]; then
            echo "::error::customer_id not found in CI database"
            docker exec thesis-mariadb mysql -uroot -p"$CI_DB_PASSWORD" -e "SHOW TABLES IN customer_database;" 2>/dev/null || true
            exit 1
          fi
          echo "customer_id=$CID" >> "$GITHUB_ENV"
          echo "CUSTOMER_ID=$CID" >> "$GITHUB_OUTPUT"

      # 安裝 k6 v2.2.0 (固定版本; 不用 latest)
      - name: Install k6 ${{ env.K6_VERSION }}
        run: |
          set -e
          K6_TAG="${K6_VERSION}"
          K6_VER="${K6_VERSION#v}"
          ASSET="k6-v${K6_VER}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_TAG}/${ASSET}" -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-v${K6_VER}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      # ---- Smoke: 10 VU / 30s ----
      - name: Run k6 smoke test (10 VU / 30s)
        working-directory: thesis/load_tests
        env:
          K6_JSON_SUMMARY: k6-smoke-summary.json
        run: |
          set -o pipefail
          k6 run \
            --vus 10 \
            --duration 30s \
            --env CUSTOMER_ID="$CUSTOMER_ID" \
            --env CUSTOMER_URL="http://localhost:5001" \
            --out json=k6-smoke.jsonl \
            load-test.js 2>&1 | tee k6-smoke-summary.txt

      # ---- Load: 50 VU / 60s ----
      - name: Run k6 load test (50 VU / 60s)
        working-directory: thesis/load_tests
        env:
          K6_JSON_SUMMARY: k6-load-summary.json
        run: |
          set -o pipefail
          k6 run \
            --vus 50 \
            --duration 60s \
            --env CUSTOMER_ID="$CUSTOMER_ID" \
            --env CUSTOMER_URL="http://localhost:5001" \
            --out json=k6-load.jsonl \
            load-test.js 2>&1 | tee k6-load-summary.txt

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: |
            thesis/load_tests/k6-smoke.jsonl
            thesis/load_tests/k6-load.jsonl
            thesis/load_tests/k6-smoke-summary.json
            thesis/load_tests/k6-load-summary.json
            thesis/load_tests/k6-smoke-summary.txt
            thesis/load_tests/k6-load-summary.txt

      # 無論成功或失敗都收集 docker logs
      - name: Collect docker logs
        if: always()
        run: |
          docker compose logs > docker-logs.txt 2>&1 || true
          wc -l docker-logs.txt

      - name: Upload docker logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ github.run_number }}
          path: docker-logs.txt

      - name: Stop compose stack
        if: always()
        run: docker compose down --volumes
